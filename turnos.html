<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de los Turnos - Campamento Verano 2026</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --dark: #343a40;
            --light: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 15px;
            color: var(--dark);
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.4rem;
            color: var(--dark);
            margin-bottom: 20px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #6c757d;
            margin-top: -15px;
            margin-bottom: 25px;
        }
        .btn-turno {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 10px 0;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-turno:active {
            background-color: #0056b3;
        }
        #listado-container {
            display: none;
            margin-top: 25px;
            text-align: left;
            border-top: 2px solid #dee2e6;
            padding-top: 20px;
        }
        h2 {
            font-size: 1.15rem;
            color: var(--success);
            text-transform: uppercase;
            margin-bottom: 15px;
            text-align: center;
        }
        .btn-item {
            display: block;
            background-color: var(--light);
            color: var(--dark);
            text-decoration: none;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 0.95rem;
            border-left: 4px solid var(--success);
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-item:active {
            background-color: #e2e6ea;
        }
        .btn-back {
            display: block;
            margin-top: 20px;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Información de los turnos de campamento verano 2026</h1>
    <p class="subtitle">Selecciona tu turno para acceder al cuaderno digitalizado:</p>

    <!-- PANTALLA 1: SELECCIÓN DE TURNOS -->
    <div id="pantalla-turnos">
        <button class="btn-turno" onclick="mostrarTurno('cme-cora', 'CME-CORA')">CME-CORA</button>
        <button class="btn-turno" onclick="mostrarTurno('maestranza', 'MAESTRANZA')">MAESTRANZA</button>
        <button class="btn-turno" onclick="mostrarTurno('torzal-moraleda', 'TORZAL-MORALEDA')">TORZAL-MORALEDA</button>
    </div>

    <!-- PANTALLA 2: LISTADO DE ÍTEMS (DINÁMICO) -->
    <div id="listado-container">
        <h2 id="titulo-turno"></h2>
        <div id="lista-enlaces"></div>
        <button class="btn-back" onclick="volver()">Volver a los turnos</button>
    </div>
</div>

<script>
    // Definición de los ítems y sus nombres de archivo correspondientes
    const items = [
        { nombre: "Horario día 1", archivo: "HD1.jpg" },
        { nombre: "Horario día 2", archivo: "HD2.jpg" },
        { nombre: "Horario día 3", archivo: "HD3.jpg" },
        { nombre: "Horario día 4", archivo: "HD4.jpg" },
        { nombre: "Horario día 5", archivo: "HD5.jpg" },
        { nombre: "Horario día 6", archivo: "HD6.jpg" },
        { nombre: "Horario día 7", archivo: "HD7.jpg" },
        { nombre: "Horario día 8", archivo: "HD8.jpg" },
        { nombre: "Horario día 9", archivo: "HD9.jpg" },
        { nombre: "Turnos de servicio", archivo: "Servicios.jpg" },
        { nombre: "Jornada deportiva 1", archivo: "jd1.jpg" },
        { nombre: "Jornada deportiva 2", archivo: "jd2.jpg" },
        { nombre: "Jornada deportiva 3", archivo: "jd3.jpg" },
        { nombre: "Jornada deportiva 4", archivo: "jd4.jpg" },
        { nombre: "Jornada deportiva 5", archivo: "jd5.jpg" },
        { nombre: "Jornada deportiva 6", archivo: "jd6.jpg" }
    ];

    function mostrarTurno(carpeta, nombreVisible) {
        // Ocultar botones principales
        document.getElementById('pantalla-turnos').style.display = 'none';
        
        // Configurar título del turno elegido
        document.getElementById('titulo-turno').innerText = "Turno: " + nombreVisible;
        
        // Generar el listado de botones dinámicamente apuntando a la carpeta correcta
        const listaDiv = document.getElementById('lista-enlaces');
        listaDiv.innerHTML = ""; // Limpiar contenido previo
        
        items.forEach(item => {
            const enlace = document.createElement('a');
            enlace.className = 'btn-item';
            // Construye la ruta relativa: carpeta/archivo (ej: cme-cora/HD1.jpg)
            enlace.href = carpeta + "/" + item.archivo;
            enlace.innerText = item.nombre;
            listaDiv.appendChild(enlace);
        });
        
        // Mostrar contenedor del listado
        document.getElementById('listado-container').style.display = 'block';
    }

    function volver() {
        // Intercambiar pantallas para regresar al menú inicial
        document.getElementById('listado-container').style.display = 'none';
        document.getElementById('pantalla-turnos').style.display = 'block';
    }
</script>

</body>
</html>
