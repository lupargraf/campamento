<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENIGMA 8 - Puzzle Deslizante</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #080c14;
            color: #f8fafc;
            touch-action: manipulation;
        }
        .title-font {
            font-family: 'Cinzel', serif;
        }
        .puzzle-tile {
            transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.15s ease;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .puzzle-tile:active {
            scale: 0.98;
        }
        /* Custom smooth appearance for victory screen */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 sm:p-4 overflow-hidden select-none bg-slate-950">

    <!-- Header Section -->
    <header class="w-full text-center py-2 flex-shrink-0">
        <h1 class="title-font text-4xl sm:text-6xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-amber-600 drop-shadow-[0_2px_15px_rgba(251,191,36,0.4)]">
            ENIGMA 8
        </h1>

        <!-- Team Name Input Form -->
        <div id="team-input-container" class="mt-3 max-w-sm mx-auto px-4">
            <form onsubmit="handleTeamSubmit(event)" class="flex flex-col items-center gap-2">
                <label for="team-input" class="text-xs sm:text-sm font-bold text-amber-300 uppercase tracking-widest">
                    EQUIPO
                </label>
                <div class="flex w-full gap-2 justify-center items-center">
                    <input 
                        type="text" 
                        id="team-input" 
                        placeholder="Nombre de tu equipo" 
                        required 
                        class="w-full px-3 py-2 bg-slate-900 border border-amber-500/40 rounded-xl text-amber-100 text-sm focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/30 text-center font-semibold placeholder:text-slate-500"
                    />
                    <button 
                        type="submit" 
                        class="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg transition active:scale-95 cursor-pointer whitespace-nowrap"
                    >
                        Aceptar
                    </button>
                </div>
            </form>
        </div>
    </header>

    <!-- Main Responsive Game Area (hidden until team name is accepted) -->
    <main id="game-container" class="w-full max-w-lg flex-col items-center justify-center flex-grow my-auto px-1 sm:px-3 hidden">
        
        <!-- Controls & Score Bar -->
        <div class="w-full flex justify-between items-center mb-2 px-2 text-xs sm:text-sm text-slate-300 font-semibold flex-shrink-0">
            <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
                <span id="display-team-name" class="text-amber-400 font-bold max-w-[130px] sm:max-w-[180px] truncate">Equipo: -</span>
                <span class="text-slate-700">|</span>
                <span class="text-slate-400">Movs:</span>
                <span id="move-counter" class="text-amber-400 text-base font-bold">0</span>
            </div>
            <button id="shuffle-btn" onclick="shufflePuzzle()" class="px-4 py-1.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-bold rounded-lg shadow-lg transition active:scale-95 flex items-center gap-1.5 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reiniciar
            </button>
        </div>

        <!-- Puzzle Board Container -->
        <div class="relative w-full aspect-square max-h-[62vh] sm:max-h-[460px] bg-slate-900 p-2 sm:p-2.5 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-2 border-amber-500/30 flex items-center justify-center">
            
            <div id="board" class="w-full h-full grid grid-cols-4 grid-rows-4 gap-1 sm:gap-1.5 relative bg-slate-950 rounded-xl overflow-hidden p-1">
                <!-- Tiles dynamically generated via JS -->
            </div>

            <!-- Victory Overlay displaying complete image -->
            <div id="victory-modal" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-3 text-center rounded-2xl hidden z-30 fade-in border-2 border-amber-400/60 shadow-2xl">
                
                <!-- Team Name Display Above Solution -->
                <div id="victory-team-display" class="text-amber-300 text-base sm:text-xl font-black title-font mb-0.5 tracking-wider uppercase drop-shadow-[0_2px_8px_rgba(251,191,36,0.3)]">
                    EQUIPO: -
                </div>

                <div class="text-amber-400 text-sm sm:text-base font-extrabold title-font mb-1 flex items-center gap-1.5">
                    <span>🏆</span> ¡ENIGMA COMPLETO! <span>🏆</span>
                </div>
                
                <!-- Complete Image Display -->
                <div class="w-full max-w-[250px] sm:max-w-[290px] aspect-square rounded-xl overflow-hidden border-2 border-amber-400 shadow-xl mb-1.5">
                    <img id="full-image" src="https://lupargraf.github.io/campamento/cascada/cascada-calavera.jpg" alt="Imagen Completa Cascada Calavera" class="w-full h-full object-cover">
                </div>

                <p class="text-xs sm:text-sm text-slate-300 mb-1.5 font-medium">
                    Resuelto en <span id="final-moves" class="font-bold text-amber-400 text-base">0</span> movimientos.
                </p>

                <div class="bg-amber-500/10 border border-amber-500/30 p-2 rounded-xl text-[11px] sm:text-xs text-amber-200 mb-2 max-w-xs font-medium">
                    📱 Recuerda hacer pantallazo y enviarlo por whatsapp al jefe de juego.
                </div>

                <button onclick="shufflePuzzle()" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs sm:text-sm rounded-xl shadow-lg transition active:scale-95 cursor-pointer">
                    Jugar de nuevo
                </button>
            </div>

        </div>

    </main>

    <!-- Footer / Explanatory Text -->
    <header class="w-full max-w-lg text-center py-2 px-2 flex-shrink-0">
        <p class="text-xs sm:text-sm text-amber-300/90 font-semibold leading-tight sm:leading-normal bg-slate-900/90 py-2.5 px-3.5 rounded-xl border border-amber-500/20 shadow-lg">
            Cuando alguien lo tenga completo, hacer pantallazo y enviarlo por whatsapp al jefe de juego.
        </p>
    </header>

    <script>
        // Exact piece URLs mapped from 1 to 16
        const TILE_IMAGES = {
            1: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_1.jpg",
            2: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_2.jpg",
            3: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_3.jpg",
            4: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_4.jpg",
            5: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_5.jpg",
            6: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_6.jpg",
            7: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_7.jpg",
            8: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_8.jpg",
            9: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_9.jpg",
            10: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_10.jpg",
            11: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_11.jpg",
            12: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_12.jpg",
            13: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_13.jpg",
            14: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_14.jpg",
            15: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_15.jpg",
            16: "https://lupargraf.github.io/campamento/cascada/cascada-calavera_16.jpg"
        };

        const FULL_IMAGE_URL = "https://lupargraf.github.io/campamento/cascada/cascada-calavera.jpg";

        const BOARD_SIZE = 4;
        const TOTAL_TILES = 16;

        let boardState = [];
        let moveCount = 0;
        let isSolved = false;
        let teamName = "";

        const boardElement = document.getElementById('board');
        const moveCounterElement = document.getElementById('move-counter');
        const victoryModal = document.getElementById('victory-modal');
        const finalMovesElement = document.getElementById('final-moves');
        const gameContainer = document.getElementById('game-container');
        const teamInputContainer = document.getElementById('team-input-container');
        const teamInput = document.getElementById('team-input');
        const displayTeamName = document.getElementById('display-team-name');
        const victoryTeamDisplay = document.getElementById('victory-team-display');

        /**
         * Handles team submission:
         * Stores team name, shows game area, hides form, and starts puzzle.
         */
        function handleTeamSubmit(e) {
            if (e) e.preventDefault();
            const val = teamInput.value.trim();
            if (!val) return;

            teamName = val;
            displayTeamName.textContent = `Equipo: ${teamName}`;
            victoryTeamDisplay.textContent = `EQUIPO: ${teamName}`;

            // Hide team form, show puzzle area
            teamInputContainer.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            gameContainer.classList.add('flex');

            initGame();
        }

        /**
         * Initialize the puzzle:
         * Gap (0) placed at position 0 (top-left).
         * Remaining 15 tiles randomly scrambled with guaranteed solvability.
         */
        function initGame() {
            moveCount = 0;
            isSolved = false;
            victoryModal.classList.add('hidden');
            updateMoveCounter();

            boardState = generateValidScramble();
            renderBoard();
        }

        /**
         * Generates a solvable permutation with gap (0) at index 0 (top left).
         */
        function generateValidScramble() {
            let tiles = [];
            for (let i = 1; i <= 15; i++) tiles.push(i);

            do {
                // Fisher-Yates Shuffle
                for (let i = tiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
                }
            } while (!isSolvable4x4(tiles, 0) || isAlreadySorted(tiles));

            // Place gap (0) at index 0 (top-left) as requested
            return [0, ...tiles];
        }

        /**
         * Solvability checker for 4x4 sliding puzzle given the gap row index.
         */
        function isSolvable4x4(tiles, emptyIndex) {
            let inversions = 0;
            for (let i = 0; i < tiles.length; i++) {
                for (let j = i + 1; j < tiles.length; j++) {
                    if (tiles[i] > tiles[j]) {
                        inversions++;
                    }
                }
            }

            const emptyRowFromTop = Math.floor(emptyIndex / 4); // 0
            const emptyRowFromBottom = 4 - emptyRowFromTop; // 4

            if (emptyRowFromBottom % 2 === 1) {
                return inversions % 2 === 0;
            } else {
                return inversions % 2 === 1;
            }
        }

        function isAlreadySorted(tiles) {
            for (let i = 0; i < tiles.length; i++) {
                if (tiles[i] !== i + 1) return false;
            }
            return true;
        }

        /**
         * Renders the 4x4 grid of tiles using direct image elements.
         */
        function renderBoard() {
            boardElement.innerHTML = '';

            boardState.forEach((tileVal, currentIndex) => {
                const tileDiv = document.createElement('div');
                tileDiv.className = 'puzzle-tile relative rounded-lg overflow-hidden select-none bg-slate-900 border border-slate-800 shadow';

                if (tileVal === 0) {
                    // Empty space top-left slot
                    tileDiv.classList.add('bg-slate-950/80', 'border-2', 'border-dashed', 'border-slate-800', 'cursor-default');
                    tileDiv.innerHTML = `<div class="w-full h-full flex items-center justify-center text-slate-800 text-xs font-bold">VACIÓ</div>`;
                } else {
                    tileDiv.classList.add('cursor-pointer', 'hover:border-amber-400/50');

                    // Tile Image
                    const img = document.createElement('img');
                    img.src = TILE_IMAGES[tileVal];
                    img.alt = `Pieza ${tileVal}`;
                    img.className = 'w-full h-full object-cover pointer-events-none';
                    tileDiv.appendChild(img);

                    // Click event
                    tileDiv.addEventListener('click', () => handleTileClick(currentIndex));

                    // Touch events for drag/swipe gesture support
                    tileDiv.addEventListener('touchstart', (e) => handleTouchStart(e, currentIndex), { passive: true });
                    tileDiv.addEventListener('touchend', (e) => handleTouchEnd(e, currentIndex), { passive: true });
                }

                boardElement.appendChild(tileDiv);
            });
        }

        /**
         * Touch start tracking for touch gesture swipe sliding
         */
        function handleTouchStart(e, index) {
            if (e.touches && e.touches.length > 0) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                activeTouchIndex = index;
            }
        }

        /**
         * Touch end calculation to trigger move towards adjacent empty space
         */
        function handleTouchEnd(e, index) {
            if (activeTouchIndex !== index) return;

            if (e.changedTouches && e.changedTouches.length > 0) {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;

                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;

                // If swipe distance is significant, check direction vs empty slot position
                if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
                    const emptyIndex = boardState.indexOf(0);
                    if (isAdjacent(index, emptyIndex)) {
                        const targetDirection = getDirection(index, emptyIndex);
                        let swipeDirection = "";

                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            swipeDirection = diffX > 0 ? "right" : "left";
                        } else {
                            swipeDirection = diffY > 0 ? "down" : "up";
                        }

                        if (targetDirection === swipeDirection || true) {
                            moveTile(index, emptyIndex);
                            return;
                        }
                    }
                }
            }

            // Fallback tap action
            handleTileClick(index);
        }

        function getDirection(fromIdx, toIdx) {
            const r1 = Math.floor(fromIdx / BOARD_SIZE);
            const c1 = fromIdx % BOARD_SIZE;
            const r2 = Math.floor(toIdx / BOARD_SIZE);
            const c2 = toIdx % BOARD_SIZE;

            if (r2 === r1 && c2 === c1 + 1) return "right";
            if (r2 === r1 && c2 === c1 - 1) return "left";
            if (r2 === r1 + 1 && c2 === c1) return "down";
            if (r2 === r1 - 1 && c2 === c1) return "up";
            return "";
        }

        /**
         * Handles tile movement logic on click or tap
         */
        function handleTileClick(index) {
            if (isSolved) return;

            const emptyIndex = boardState.indexOf(0);
            if (isAdjacent(index, emptyIndex)) {
                moveTile(index, emptyIndex);
            }
        }

        function moveTile(fromIndex, toEmptyIndex) {
            boardState[toEmptyIndex] = boardState[fromIndex];
            boardState[fromIndex] = 0;

            moveCount++;
            updateMoveCounter();
            renderBoard();

            checkVictory();
        }

        function isAdjacent(idx1, idx2) {
            const r1 = Math.floor(idx1 / BOARD_SIZE);
            const c1 = idx1 % BOARD_SIZE;
            const r2 = Math.floor(idx2 / BOARD_SIZE);
            const c2 = idx2 % BOARD_SIZE;

            return (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1);
        }

        function updateMoveCounter() {
            moveCounterElement.textContent = moveCount;
        }

        /**
         * Checks victory condition:
         * Slots 0 to 14 contain tiles 1 to 15 in order.
         * Slot 15 contains the empty space (0).
         */
        function checkVictory() {
            for (let i = 0; i < TOTAL_TILES - 1; i++) {
                if (boardState[i] !== i + 1) return;
            }
            if (boardState[15] === 0) {
                isSolved = true;
                finalMovesElement.textContent = moveCount;
                setTimeout(() => {
                    victoryModal.classList.remove('hidden');
                }, 200);
            }
        }

        function shufflePuzzle() {
            initGame();
        }

        // Wait for team entry before starting puzzle view
        window.onload = function() {
            // Auto focus team name input on load
            if (teamInput) teamInput.focus();
        };
    </script>
</body>
</html>
