<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contadores</title>
  <style>
    body {
      background-color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }
    body {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
    table {
      border-collapse: collapse;
      margin: 0 auto;
    }
    .square-cell {
      text-align: center;
      vertical-align: middle;
      width: 180px;
      height: 180px;
    }
    .square {
      width: 100%;
      height: 70%;
      cursor: pointer;
    }
    .square:pressed {
  transform: scale(0.85);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
  transition: transform 0.1s, box-shadow 0.1s;
}
    .title {
      font-size: 18px;
      font-weight: bold;
    }
    .counters {
      font-size: 12px;
    }
    .button {
      background-color: #FF0000;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      cursor: pointer;
    }
    .button:active {
  transform: scale(0.85);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
  transition: transform 0.1s, box-shadow 0.1s;
}
    .hidden {
      display: none;
    }
    .team-table {
    width: 100%;
    max-width: 600px; /* opcional, para limitar tamaño en pantallas grandes */
    margin: 0 auto;
    table-layout: fixed;
    word-wrap: break-word;
}
    .team-table th, .team-table td {
      padding: 5px;
    }
    .flag {
  width: 100%;
  height: 70%;
  object-fit: contain;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.12s ease, filter 0.12s ease;
}

.flag.pressed {
  transform: scale(0.88);
  filter: brightness(1.35);
}
  </style>
</head>
<body>
<audio id="beep" src="https://lupargraf.github.io/campamento/Pataco.mp3"></audio>
<table>
  <tr>
    <td class="square-cell">
      <div class="title">AUSTRIA</div>
      <img id="square0" class="flag" src="Banderas/Austria.jpg" onclick="updateCounts(0)">
      <div class="counters" id="countLeft0">10</div>
      <div class="counters" id="countRight0">0</div>
    </td>
    <td class="square-cell">
      <div class="title">BÉLGICA</div>
      <img id="square1" class="flag" src="Banderas/Belgica.jpg" onclick="updateCounts(1)">
      <div class="counters" id="countLeft1">10</div>
      <div class="counters" id="countRight1">0</div>
    </td>
    <td class="square-cell">
      <div class="title">ITALIA</div>
      <img id="square2" class="flag" src="Banderas/Italia.jpg" onclick="updateCounts(2)">
      <div class="counters" id="countLeft2">10</div>
      <div class="counters" id="countRight2">0</div>
    </td>
  </tr>
  <tr>
    <td class="square-cell">
      <div class="title">JAPÓN</div>
      <img id="square3" class="flag" src="Banderas/Japon.jpg" onclick="updateCounts(3)">
      <div class="counters" id="countLeft3">10</div>
      <div class="counters" id="countRight3">0</div>
    </td>
    <td class="square-cell"></td>
    <td class="square-cell">
      <div class="title">SUIZA</div>
      <img id="square4" class="flag" src="Banderas/Suiza.jpg" onclick="updateCounts(4)">
      <div class="counters" id="countLeft4">10</div>
      <div class="counters" id="countRight4">0</div>
    </td>
  </tr>
  <tr>
    <td class="square-cell">
      <div class="title">ALEMANIA</div>
      <img id="square5" class="flag" src="Banderas/Alemania.jpg" onclick="updateCounts(5)">
      <div class="counters" id="countLeft5">10</div>
      <div class="counters" id="countRight5">0</div>
    </td>
    <td class="square-cell">
      <div class="title">EEUU</div>
      <img id="square6" class="flag" src="Banderas/EEUU.jpg" onclick="updateCounts(6)">
      <div class="counters" id="countLeft6">10</div>
      <div class="counters" id="countRight6">0</div>
    </td>
    <td class="square-cell">
      <div class="title">FRANCIA</div>
      <img id="square7" class="flag" src="Banderas/Francia.jpg" onclick="updateCounts(7)">
      <div class="counters" id="countLeft7">10</div>
      <div class="counters" id="countRight7">0</div>
    </td>
  </tr>
  <tr>
      <td class="square-cell">
      <div class="title">INGLATERRA</div>
      <img id="square8" class="flag" src="Banderas/Inglaterra.jpg" onclick="updateCounts(8)">
      <div class="counters" id="countLeft8">10</div>
      <div class="counters" id="countRight8">0</div>
    </td>
   <td class="square-cell"></td>
      <td class="square-cell">
      <div class="title">P. BAJOS</div>
      <img id="square9" class="flag" src="Banderas/Paisesbajos.jpg" onclick="updateCounts(9)">
      <div class="counters" id="countLeft9">10</div>
      <div class="counters" id="countRight9">0</div>
    </td>
    </tr>
  <tr>
    <td colspan="3">
      <button class="button" onclick="showResults()">FINAL</button>
    </td>
  </tr>
</table>

<div id="results" class="hidden">
  <table class="team-table">
    <tr>
      <th>Equipo</th>
      <th>Puntuación Final</th>
    </tr>
  </table>
</div>

<script>
  var leftCounts = [10, 10, 10, 10, 10, 10, 10, 10, 10, 10];
  var rightCounts = new Array(leftCounts.length).fill(0);

  function updateCounts(index) {
  if (leftCounts[index] > 0) {
    var now = new Date();
    var timeElapsed = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    leftCounts[index]--;

    var currentRightCount = 86400 - timeElapsed;
    rightCounts[index] += currentRightCount;

    document.getElementById('countLeft' + index).textContent = leftCounts[index];
    document.getElementById('countRight' + index).textContent = rightCounts[index];

    // Efecto visual (flash temporal)
    const button = document.getElementById('square' + index);
    if (button) {
    button.classList.add('pressed');
    setTimeout(() => {
        button.classList.remove('pressed');
    }, 150);
}

document.getElementById("beep").play();
    setTimeout(() => {
      button.classList.remove('pressed');
    }, 150);

    // Sonido
    document.getElementById("beep").play();
  }
}

  function showResults() {
  var teams = ["AUSTRIA", "BÉLGICA", "ITALIA", "JAPÓN", "SUIZA", "ALEMANIA", "EEUU", "FRANCIA", "INGLATERRA", "P. BAJOS"];

  var table = document.querySelector(".team-table");
  
  // Elimina las filas anteriores excepto la cabecera
  while (table.rows.length > 1) {
    table.deleteRow(1);
  }

  for (var i = 0; i < teams.length; i++) {
    var row = table.insertRow();
    row.insertCell(0).textContent = teams[i];
    row.insertCell(1).textContent = Math.floor(rightCounts[i]);
  }

  document.getElementById('results').classList.remove('hidden');
}
</script>
  <script>
  // Truco para forzar a Safari a reconocer :active en elementos que no son enlaces ni botones
  document.addEventListener("touchstart", function() {}, true);
</script>
</body>
</html>
