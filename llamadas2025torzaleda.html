<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contadores</title>
  <style>
    body {
      background-color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }
    body {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
    table {
      border-collapse: collapse;
      margin: 0 auto;
    }
    .square-cell {
      text-align: center;
      vertical-align: middle;
      width: 180px;
      height: 180px;
    }
    .square {
      width: 100%;
      height: 70%;
      cursor: pointer;
    }
    .square:pressed {
  transform: scale(0.85);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
  transition: transform 0.1s, box-shadow 0.1s;
}
    .title {
      font-size: 18px;
      font-weight: bold;
    }
    .counters {
      font-size: 12px;
    }
    .button {
      background-color: #FF0000;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      cursor: pointer;
    }
    .button:active {
  transform: scale(0.85);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
  transition: transform 0.1s, box-shadow 0.1s;
}
    .hidden {
      display: none;
    }
    .team-table {
    width: 100%;
    max-width: 600px; /* opcional, para limitar tamaño en pantallas grandes */
    margin: 0 auto;
    table-layout: fixed;
    word-wrap: break-word;
}
    .team-table th, .team-table td {
      padding: 5px;
    }
    .square {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.square.pressed {
  transform: scale(0.85);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
}
  </style>
</head>
<body>
<audio id="beep" src="https://lupargraf.github.io/campamento/Pataco.mp3"></audio>
<table>
  <tr>
    <!-- Fila 1: 3 botones -->
    <td class="square-cell">
      <div class="title">TÍO JACK</div>
      <div class="square" style="background-color: #F39200;" onclick="updateCounts(0)"></div>
      <div class="counters" id="countLeft0">10</div>
      <div class="counters" id="countRight0">0</div>
    </td>
    <td class="square-cell">
      <div class="title">GIBBS</div>
      <div class="square" style="background-color: #36A9E1;" onclick="updateCounts(1)"></div>
      <div class="counters" id="countLeft1">7</div>
      <div class="counters" id="countRight1">0</div>
    </td>
    <td class="square-cell">
      <div class="title">PATA PALO</div>
      <div class="square" style="background-color: #C9D400;" onclick="updateCounts(2)"></div>
      <div class="counters" id="countLeft2">7</div>
      <div class="counters" id="countRight2">0</div>
    </td>
  </tr>
  <tr>
    <!-- Fila 2: 1 botón centrado -->
    <td></td>
    <td class="square-cell">
      <div class="title">W. TURNER</div>
      <div class="square" style="background-color: #ABB8DF;" onclick="updateCounts(3)"></div>
      <div class="counters" id="countLeft3">6</div>
      <div class="counters" id="countRight3">0</div>
    </td>
    <td></td>
  </tr>
  <tr>
    <!-- Fila 3: 3 botones -->
    <td class="square-cell">
      <div class="title">J. SPARROW</div>
      <div class="square" style="background-color: #A3D0A3;" onclick="updateCounts(4)"></div>
      <div class="counters" id="countLeft4">9</div>
      <div class="counters" id="countRight4">0</div>
    </td>
    <td class="square-cell">
      <div class="title">DAVY JONES</div>
      <div class="square" style="background-color: #F191A6;" onclick="updateCounts(5)"></div>
      <div class="counters" id="countLeft5">8</div>
      <div class="counters" id="countRight5">0</div>
    </td>
    <td class="square-cell">
      <div class="title">KRAKEN</div>
      <div class="square" style="background-color: #FFD100;" onclick="updateCounts(6)"></div>
      <div class="counters" id="countLeft6">8</div>
      <div class="counters" id="countRight6">0</div>
    </td>
  </tr>
  <tr>
    <!-- Fila 4: 1 botón centrado -->
    <td></td>
    <td class="square-cell">
      <div class="title">P. NEGRA</div>
      <div class="square" style="background-color: #444;" onclick="updateCounts(7)"></div>
      <div class="counters" id="countLeft7">11</div>
      <div class="counters" id="countRight7">0</div>
    </td>
    <td></td>
  </tr>
  <tr>
    <td colspan="3">
      <button class="button" onclick="showResults()">FINAL</button>
    </td>
  </tr>
</table>

<div id="results" class="hidden">
  <table class="team-table">
    <tr>
      <th>Equipo</th>
      <th>Puntuación Final</th>
    </tr>
  </table>
</div>

<script>
  var leftCounts = [10, 7, 7, 6, 9, 8, 8, 11];
  var rightCounts = new Array(leftCounts.length).fill(0);

  function updateCounts(index) {
    if (leftCounts[index] > 0) {
        var now = new Date();
        var timElapsed = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        leftCounts[index]--;

        var currentRightCount = 86400 - timElapsed;
        rightCounts[index] += currentRightCount;

        document.getElementById('countLeft' + index).textContent = leftCounts[index];
        document.getElementById('countRight' + index).textContent = rightCounts[index];

        document.getElementById("beep").play();

        // ✨ Efecto visual solo si se ha sumado
        const square = document.querySelectorAll(".square")[index];
        square.classList.add("pressed");
        setTimeout(() => square.classList.remove("pressed"), 150);
    }
}

  function showResults() {
  var teams = ["TÍO JACK", "GIBBS", "PATA PALO", "W. TURNER", "J. SPARROW", "DAVY JONES", "KRAKEN", "P. NEGRA"];

  var table = document.querySelector(".team-table");
  
  // Elimina las filas anteriores excepto la cabecera
  while (table.rows.length > 1) {
    table.deleteRow(1);
  }

  for (var i = 0; i < teams.length; i++) {
    var row = table.insertRow();
    row.insertCell(0).textContent = teams[i];
    row.insertCell(1).textContent = Math.floor(rightCounts[i]);
  }

  document.getElementById('results').classList.remove('hidden');
}
</script>
  <script>
  // Truco para forzar a Safari a reconocer :active en elementos que no son enlaces ni botones
  document.addEventListener("touchstart", function() {}, true);
</script>
</body>
</html>
